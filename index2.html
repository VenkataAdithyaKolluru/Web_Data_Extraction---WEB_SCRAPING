<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Scraper</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style2.css') }}">
</head>
<body>
    <div class="container">
        <h1>WEB SCRAPING FROM WEBSITES</h1>
        <form action="/scrape" method="post">
            <label for="url">Website URL:</label>
            <input type="text" id="url" name="url" required>
            <label for="tag">HTML Tag:</label>
            <input type="text" id="tag" name="tag" required>
            <label for="file_name">CSV File Name:</label>
            <input type="text" id="file_name" name="file_name" required>
            <label for="sentiment_analysis">
                <input type="checkbox" id="sentiment_analysis" name="sentiment_analysis"> Perform Sentiment Analysis
            </label>
            <label for="text_classification">
                <input type="checkbox" id="text_classification" name="text_classification"> Perform Text Classification
            </label>
            <label for="language_detection">
                <input type="checkbox" id="language_detection" name="language_detection"> Perform Language Detection
            </label>
            <input type="submit" value="SCRAPE">
        </form>
    </div>
    <div class="bottom-right-text">
        KOLLURU VENKATA ADITHYA
        <br>
        <a href="https://www.linkedin.com/in/your-linkedin-profile" target="_blank">LinkedIn</a>
    </div>
</body>
</html>
